[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "statvocab"
version = "0.1.0"
description = "Grounded vocabulary discovery for Eurostat-style statistical tables."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Repository owner" }]
dependencies = [
  "httpx>=0.28,<0.29",
  "pyarrow>=19.0,<22",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.8,<3",
  "pyyaml>=6.0.2,<7",
  "rich>=13.9,<15",
  "structlog>=25.1,<26",
  "typer>=0.16,<0.21",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<8",
  "ruff>=0.9,<0.15",
  "types-PyYAML>=6.0.12,<7",
]
notebooks = [
  "ipykernel>=6.29,<7",
  "jupyter>=1.1,<2",
  "matplotlib>=3.10,<4",
  "nbclient>=0.10,<0.11",
  "nbformat>=5.10,<6",
]
api = [
  "fastapi>=0.115,<0.119",
  "uvicorn>=0.34,<0.39",
]
ml = [
  "faiss-cpu>=1.9,<2",
  "hdbscan>=0.8.40,<0.9",
  "numpy>=2.2,<3",
  "psutil>=6.1,<8",
  "scikit-learn>=1.6,<1.8",
  "sentence-transformers>=3.4,<6",
]

[project.scripts]
statvocab = "statvocab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/statvocab"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=statvocab --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["statvocab"]
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.parquet"]
ignore_missing_imports = true
