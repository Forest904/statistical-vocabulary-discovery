name: CI

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev,notebooks]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src/statvocab
      - name: Pytest
        run: pytest

