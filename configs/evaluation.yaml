config_name: evaluation
random_seed: 42
corpus:
  name: fixture
  expected_table_count: 4
  fixture_path: data/fixtures/eurostat_star_edge_cases
paths:
  data_dir: data
  raw_dir: data/raw
  external_dir: data/external
  processed_dir: data/processed
  outputs_dir: outputs
  reports_dir: report
  prompts_dir: prompts
  cache_dir: .cache/statvocab
evaluation:
  fixture_corpus: data/fixtures/eurostat_star_edge_cases
  random_seed: 42
  extraction_review_tables: 4
  vocabulary_gold_terms: 12
extraction:
  geography_variant: enhanced
  review_sample_size: 4
  min_year: 1900
  max_year: 2100
  nuts_2024_path: data/external/NUTS_AT_2024.csv
  eurostat_geo_codelist_path: data/external/eurostat_geo_codelist.xml
  eurostat_geo_codelist_version: GEO 14.0
classification:
  gold_sample_size: 12
  blind_relabel_fraction: 0.10
  train_dev_fraction: 0.60
  validation_fraction: 0.20
  final_test_fraction: 0.20
  pearl_model: Lihuchen/pearl_small
  pearl_revision: 0d29fb4a61ec2a11b60e8b078664389eb915286b
  embedding_batch_size: 16
  abstention_threshold: 0.55
clustering:
  hdbscan_min_cluster_size: 2
  hdbscan_min_samples: 1
  hdbscan_metric: euclidean
  agglomerative_distance_threshold: 0.35
  agglomerative_linkage: average
  domain_similarity_threshold: 0.35
  domain_similarity_margin: 0.03
  representative_count: 2
  manual_review_sample_size: 12
relations:
  embedding_similarity_threshold: 0.78
  related_similarity_threshold: 0.72
  containment_min_extra_tokens: 1
  max_candidates_per_measure: 25
  manual_review_sample_size: 12
  llm_adjudication_enabled: false
  llm_confidence_threshold: 0.65
search:
  lexical_top_k: 100
  semantic_top_k: 100
  default_limit: 20
  semantic_weight: 0.35
  lexical_weight: 0.25
  measure_weight: 0.15
  dimension_weight: 0.10
  geography_weight: 0.10
  time_weight: 0.05
  min_fused_score: 0.10
  development_fraction: 0.60
  validation_fraction: 0.20
  final_test_fraction: 0.20
  embedding_batch_size: 16
