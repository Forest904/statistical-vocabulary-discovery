config_name: full
random_seed: 42
corpus:
  name: full
  archive_name: eurostat_7605_tables.tgz
  expected_table_count: 7605
  expected_md5: 175222a2497fbceee6f9f6ede6728e9c
paths:
  data_dir: data
  raw_dir: data/raw
  external_dir: data/external
  processed_dir: data/processed_full
  outputs_dir: outputs/full
  reports_dir: report/full
  prompts_dir: prompts
  cache_dir: .cache/statvocab_full
evaluation:
  fixture_corpus: data/fixtures/eurostat_star_edge_cases
  random_seed: 42
  extraction_review_tables: 50
  vocabulary_gold_terms: 500
extraction:
  geography_variant: enhanced
  review_sample_size: 50
  min_year: 1900
  max_year: 2100
  nuts_2024_path: data/external/NUTS_AT_2024.csv
  eurostat_geo_codelist_path: data/external/eurostat_geo_codelist.xml
  eurostat_geo_codelist_version: GEO 14.0
  parallel_workers: 4
  parallel_chunk_size: 25
classification:
  gold_sample_size: 500
  blind_relabel_fraction: 0.10
  train_dev_fraction: 0.60
  validation_fraction: 0.20
  final_test_fraction: 0.20
  pearl_model: Lihuchen/pearl_small
  pearl_revision: 0d29fb4a61ec2a11b60e8b078664389eb915286b
  embedding_batch_size: 64
  abstention_threshold: 0.55
  semantic_neighbor_k: 5
  semantic_hybrid_enabled: true
  threshold_objective: macro_f1_with_recall_bonus
  min_non_other_precision: 0.85
  min_measure_recall_for_promotion: 0.35
  min_other_reduction_fraction: 0.20
clustering:
  hdbscan_min_cluster_size: 5
  hdbscan_min_samples: 2
  hdbscan_metric: euclidean
  agglomerative_distance_threshold: 0.35
  agglomerative_linkage: average
  domain_similarity_threshold: 0.35
  domain_similarity_margin: 0.03
  contextual_features_enabled: true
  contextual_embedding_weight: 0.65
  contextual_table_context_weight: 0.20
  contextual_lexical_weight: 0.15
  min_domain_assignment_score: 0.35
  representative_count: 5
  manual_review_sample_size: 100
relations:
  embedding_similarity_threshold: 0.78
  related_similarity_threshold: 0.72
  containment_min_extra_tokens: 1
  max_candidates_per_measure: 25
  semantic_neighbor_k: 50
  manual_review_sample_size: 100
  llm_adjudication_enabled: false
  llm_confidence_threshold: 0.65
search:
  lexical_top_k: 100
  semantic_top_k: 100
  default_limit: 20
  semantic_weight: 0.35
  lexical_weight: 0.25
  measure_weight: 0.15
  dimension_weight: 0.10
  geography_weight: 0.10
  time_weight: 0.05
  min_fused_score: 0.10
  development_fraction: 0.60
  validation_fraction: 0.20
  final_test_fraction: 0.20
  embedding_batch_size: 64
